services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: racepective-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - JOLPICA_BASE_URL=https://api.jolpi.ca/ergast/f1
      - CACHE_TTL_SECONDS=600
      - CACHE_HISTORICAL_TTL_SECONDS=86400
      - DEFAULT_SEASON=current
      - DEBUG=False
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost:80
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000/api
    container_name: racepective-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
