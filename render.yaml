services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: racepective-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEFAULT_SEASON
        value: current
      - key: CACHE_TTL_SECONDS
        value: "600"
      - key: CACHE_HISTORICAL_TTL_SECONDS
        value: "86400"
      - key: REQUEST_TIMEOUT
        value: "10.0"
      - key: CORS_ORIGINS
        # Update this value with your live frontend domain once provisioned
        value: "https://racepective.onrender.com,https://racepective.vercel.app,http://localhost:5173"

  # 2. React SPA Static Site Frontend
  - type: web
    name: racepective-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        # Set to the live public backend URL from the backend service above
        # e.g., https://racepective-api.onrender.com/api
        value: "https://racepective-api.onrender.com/api"
